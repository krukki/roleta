<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roleta da Coca</title>
  <meta name="description" content="Toda segunda: a roleta decide quem paga a coca da semana.">
  <meta name="theme-color" content="#c4001a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <svg class="logo-can" viewBox="0 0 40 70" aria-hidden="true">
        <rect x="4" y="6" width="32" height="58" rx="7" fill="#fff7ec" stroke="#7d000d" stroke-width="2"/>
        <rect x="7" y="2" width="26" height="7" rx="3" fill="#cfd4da" stroke="#8b9299" stroke-width="1.5"/>
        <rect x="7" y="61" width="26" height="6" rx="3" fill="#cfd4da" stroke="#8b9299" stroke-width="1.5"/>
        <path d="M4 34 C 14 26, 26 44, 36 32" stroke="#d90f22" stroke-width="5" fill="none"/>
      </svg>
      <div>
        <h1>Roleta da Coca</h1>
        <p class="sub" id="week-label">Semana de …</p>
      </div>
    </div>
    <button type="button" id="mute" class="icon-btn" aria-label="Desligar som">🔊</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Seções">
    <button type="button" role="tab" data-tab="rodada" aria-selected="true">🎡 Rodada</button>
    <button type="button" role="tab" data-tab="amigos" aria-selected="false">👥 Amigos</button>
    <button type="button" role="tab" data-tab="historico" aria-selected="false">📜 Histórico</button>
  </nav>

  <main>
    <section id="tab-rodada" class="tab active" role="tabpanel"></section>
    <section id="tab-amigos" class="tab" role="tabpanel"></section>
    <section id="tab-historico" class="tab" role="tabpanel"></section>
  </main>

  <footer class="foot">Feito pra galera da coca de segunda 🥤</footer>

  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/random.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/round.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/minigames/index.js"></script>
  <script src="js/minigames/reflexo.js"></script>
  <script src="js/minigames/toques.js"></script>
  <script src="js/minigames/cronometro.js"></script>
  <script src="js/minigames/caboDeGuerra.js"></script>
  <script src="js/app.js"></script>

</html>
